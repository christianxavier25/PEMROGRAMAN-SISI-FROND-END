<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas Pertemuan 6 - Pemograman Sisi Front-End</title>
  </head>
  <body>
    <form action="#" method="GET">
      <label for="nama">Silahkan masukkan nama anda :</label>
      <input id="nama" name="nama" type="text" required />
      <br />
      <br />
      <label for="Email">Silahkan masukkan Email anda : </label>
      <input id="Email" name="Email" type="email" required />
      <br />
      <br />
      <label for="Password">Silahkan masukkan Password anda : </label>
      <input id="Password" name="Password" type="password" required />
      <br />
      <br />
      <label for="Jenis_kelamin">Silahkan masukkan Jenis kelamin anda : </label>
      <input type="radio" name="gender" value="L" required /> Laki-laki
      <input type="radio" name="gender" value="P" required /> Perempuan

      <br />
      <br />
      <label for="Hobi">Silahkan masukkan Hobi anda : </label>
      <br />
      <textarea id="Hobi" name="Hobi" rows="10" cols="50" required></textarea>

      <br />
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
